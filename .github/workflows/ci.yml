name: CI

# Deploy dijalankan Netlify (lihat netlify.toml dan admin/netlify.toml).
# CI hanya menjaga kualitas: lint, typecheck, test, build untuk app user dan admin.
on:
  push:
    branches: [staging, production, migrasi-supabase]
  pull_request:
    branches: [staging, production, migrasi-supabase]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-app:
    name: User app (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Disamakan dengan NODE_VERSION di netlify.toml.
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Next.js types
        # next-env.d.ts dan route types di-gitignore; typecheck butuh file ini.
        run: npx next typegen
      - name: Lint
        # Non-blocking sementara: ada 4 error lint lama di komponen create-campaign
        # dan demo bar (dicatat sejak Fase 0 migrasi). Jadikan blocking lagi setelah
        # error itu diperbaiki.
        continue-on-error: true
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # App fail-closed tanpa env publik ini saat build. Nilai tiruan, bukan secret.
          NEXT_PUBLIC_USE_MOCK_DATA: 'false'
          NEXT_PUBLIC_APP_ENV: 'staging'
          NEXT_PUBLIC_ADMIN_APP_URL: 'https://admin.example.test'
          NEXT_PUBLIC_APPWRITE_ENDPOINT: 'https://api.example.test/v1'
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: 'ci-project'
          NEXT_PUBLIC_APPWRITE_DATABASE_ID: 'ci-database'

  admin-app:
    name: Admin app (admin/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Next.js types
        run: npx next typegen
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_APP_ENV: 'staging'
          NEXT_PUBLIC_USER_APP_URL: 'https://app.example.test'
          NEXT_PUBLIC_APPWRITE_ENDPOINT: 'https://api-admin.example.test/v1'
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: 'ci-project'
          NEXT_PUBLIC_APPWRITE_DATABASE_ID: 'ci-database'
